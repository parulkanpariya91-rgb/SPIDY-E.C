<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 maximum-scale=1,
                 viewport-fit=cover"
    >

    <meta name="theme-color" content="#e53935">

    <title>SPIDY E.C</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="app-header">

    <div class="brand">
        <div class="brand-name">SPIDY E.C</div>
        <div class="brand-subtitle">
            SHARED MARKETPLACE
        </div>
    </div>

    <button
        class="logout-button"
        id="logoutButton"
    >
        LOG OUT
    </button>

</header>


<main class="app">

    <section class="hero">

        <h1>
            Find your next good thing.
        </h1>

        <p>
            Browse products shared by the
            SPIDY E.C community, or add your
            own listing.
        </p>

    </section>


    <section class="market-header">

        <h2>
            Community listings
        </h2>

        <button
            class="primary-button"
            id="newListingButton"
        >
            + New product listing
        </button>

    </section>


    <section class="stats">

        <div class="stat-card">

            <strong id="listingCount">
                0
            </strong>

            <span>
                Listings shared
            </span>

        </div>


        <div class="stat-card">

            <strong id="visibleCount">
                0
            </strong>

            <span>
                Items visible
            </span>

        </div>

    </section>


    <section
        id="listingGrid"
        class="listing-grid"
    ></section>

</main>


<!-- NEW LISTING SHEET -->

<div
    id="listingSheet"
    class="sheet-background"
>

    <div class="sheet">

        <div class="sheet-header">

            <h2>
                New product listing
            </h2>

            <button
                id="closeSheet"
                class="close-button"
            >
                ×
            </button>

        </div>


        <form id="listingForm">

            <label>
                Product name
            </label>

            <input
                id="productName"
                type="text"
                placeholder="Product name"
                required
            >


            <label>
                Product photo
            </label>

            <input
                id="productPhoto"
                type="file"
                accept="image/*"
                required
            >


            <img
                id="photoPreview"
                class="photo-preview"
                alt="Product preview"
            >


            <label>
                Price
            </label>

            <input
                id="productPrice"
                type="number"
                min="0"
                placeholder="₹ Price"
                required
            >


            <label>
                Description
            </label>

            <textarea
                id="productDescription"
                placeholder="Describe your product"
                required
            ></textarea>


            <label>
                Seller number
            </label>

            <input
                id="sellerNumber"
                type="tel"
                placeholder="Seller number"
                required
            >


            <button
                type="submit"
                class="submit-button"
            >
                Create listing
            </button>

        </form>

    </div>

</div>


<script src="js/app.js"></script>

</body>
</html>
